<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f1ef"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0f766e" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <!-- convex contours (level sets) -->
  <g transform="rotate(-20 600 450)" fill="none" stroke="#0f766e">
    <ellipse cx="600" cy="450" rx="360" ry="270" stroke-opacity="0.18" stroke-width="3"/>
    <ellipse cx="600" cy="450" rx="290" ry="215" stroke-opacity="0.24" stroke-width="3"/>
    <ellipse cx="600" cy="450" rx="220" ry="162" stroke-opacity="0.30" stroke-width="3"/>
    <ellipse cx="600" cy="450" rx="150" ry="110" stroke-opacity="0.38" stroke-width="3"/>
    <ellipse cx="600" cy="450" rx="82"  ry="60"  stroke-opacity="0.5"  stroke-width="3"/>
  </g>
  <!-- gradient-descent path toward the minimum -->
  <polyline points="230,220 470,360 380,470 560,430 500,500 588,458 600,450"
    fill="none" stroke="#0f766e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#0f766e" stroke-width="4">
    <circle cx="230" cy="220" r="10"/><circle cx="470" cy="360" r="9"/><circle cx="380" cy="470" r="9"/>
    <circle cx="560" cy="430" r="9"/><circle cx="500" cy="500" r="9"/><circle cx="588" cy="458" r="9"/>
  </g>
  <!-- minimum -->
  <circle cx="600" cy="450" r="38" fill="#0f766e" fill-opacity="0.2" filter="url(#soft)"/>
  <circle cx="600" cy="450" r="16" fill="#0f766e"/>
</svg>
