<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecedfb"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4338ca" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4338ca" fill-opacity="0.5"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <!-- objective direction (maximize, to the right) -->
  <g stroke="#4338ca" stroke-opacity="0.45" stroke-width="4" marker-end="url(#ar)">
    <line x1="150" y1="470" x2="270" y2="470"/><line x1="150" y1="560" x2="270" y2="560"/>
  </g>
  <polygon points="560,170 810,240 990,470 800,740 430,790 240,560 310,300"
    fill="#4338ca" fill-opacity="0.08" stroke="#4338ca" stroke-opacity="0.4" stroke-width="3"/>
  <polyline points="430,790 240,560 310,300 560,170 810,240 990,470"
    fill="none" stroke="#4338ca" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#4338ca" stroke-width="4">
    <circle cx="560" cy="170" r="11"/><circle cx="810" cy="240" r="11"/><circle cx="800" cy="740" r="11"/>
    <circle cx="430" cy="790" r="11"/><circle cx="240" cy="560" r="11"/><circle cx="310" cy="300" r="11"/>
  </g>
  <circle cx="990" cy="470" r="40" fill="#4338ca" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="990" cy="470" r="17" fill="#4338ca"/>
</svg>
