<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6e8ec"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9f1239" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <!-- feasible polytope -->
  <polygon points="600,140 930,360 830,740 380,760 230,420"
    fill="#9f1239" fill-opacity="0.07" stroke="#9f1239" stroke-opacity="0.4" stroke-width="3"/>
  <g fill="#ffffff" stroke="#9f1239" stroke-width="4">
    <circle cx="600" cy="140" r="11"/><circle cx="830" cy="740" r="11"/>
    <circle cx="380" cy="760" r="11"/><circle cx="230" cy="420" r="11"/>
  </g>
  <!-- central path from analytic center to the optimal vertex -->
  <path d="M 540 520 C 620 460, 760 430, 900 372" fill="none"
    stroke="#9f1239" stroke-width="7" stroke-linecap="round"/>
  <!-- interior iterates -->
  <g fill="#9f1239">
    <circle cx="540" cy="520" r="7"/><circle cx="642" cy="466" r="7"/>
    <circle cx="742" cy="437" r="7"/><circle cx="828" cy="404" r="7"/>
  </g>
  <!-- optimal vertex -->
  <circle cx="930" cy="360" r="40" fill="#9f1239" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="930" cy="360" r="17" fill="#9f1239"/>
</svg>
