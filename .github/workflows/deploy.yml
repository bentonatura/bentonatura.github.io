name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install ImageMagick
        # used by jekyll-imagemagick to create the responsive .webp images
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick
          # newer ImageMagick 7 packages may only provide `magick`
          command -v convert || sudo ln -s "$(command -v magick)" /usr/local/bin/convert
          convert -version | head -1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The theme ships all of Font Awesome; keep only the icons the site uses
      # (bin/subset_icon_fonts.py finds them in the built pages).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trim icon fonts
        run: |
          pip install --quiet fonttools==4.55.6 brotli==1.1.0
          python bin/subset_icon_fonts.py _site

      # Drop the CSS rules no page uses (most of Bootstrap, MDB and Font Awesome).
      - name: Strip unused CSS
        run: >
          npx --yes purgecss@7.0.2
          --css "_site/assets/css/*.css"
          --content "_site/**/*.html" "_site/**/*.js"
          --skippedContentGlobs "_site/assets/**/*.html"
          --output _site/assets/css/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
